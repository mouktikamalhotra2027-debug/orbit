function navigate(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');render(page);window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
function escapeHTML(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function escapeAttr(v){return escapeHTML(v).replace(/'/g,'&#39;')}
function saveCreatorProfile(){let name=document.getElementById('profileName').value.trim(),niche=document.getElementById('profileNiche').value,followers=document.getElementById('profileFollowers').value.trim(),bio=document.getElementById('profileBio').value.trim(),url=document.getElementById('profileUrl').value.trim();if(!name){toast('Please add your display name.');return}if(url&&!/^https?:\/\//i.test(url)){toast('Profile URL should start with https://');return}state.profile={...(state.profile||{}),name,email:document.getElementById('profileEmail')?.value.trim()||state.profile?.email||'',handle:document.getElementById('profileHandle')?.value.trim().replace(/^@/,'')||state.profile?.handle||'',niche,followers,bio,url,setupComplete:true};save();syncIdentity();render('profile');toast('Creator profile saved on this device ✓')}
function shell(title,sub,button=''){return `<div class="page-head"><div><div class="kicker">Creator collective / October 2026</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`}
function stats(){return `<div class="stats"><div class="stat"><div class="stat-top">Crew attendance <span class="stat-icon">◎</span></div><div class="stat-num">${12+state.attended.length}<span style="font-size:14px;color:var(--muted)"> / 15</span></div><div class="stat-foot"><span class="good">↑ Showing up</span> builds trust</div></div><div class="stat"><div class="stat-top">Reliability <span class="stat-icon">✧</span></div><div class="stat-num">${state.applied.length? 'New':'92'}<span style="font-size:14px;color:var(--muted)">${state.applied.length?'':'%'}</span></div><div class="stat-foot">Based on <b>5</b> completed brand jobs</div></div><div class="stat"><div class="stat-top">Open opportunities <span class="stat-icon">◈</span></div><div class="stat-num">${state.deals.filter(d=>d.status==='Open').length}</div><div class="stat-foot">Matched to your interests</div></div><div class="stat"><div class="stat-top">Applications sent <span class="stat-icon">↗</span></div><div class="stat-num">${state.applied.length}</div><div class="stat-foot">Your next collab is out there</div></div></div>`}
function postCard(post,idx){let id=post.id||idx+1,att=state.attended.includes(id);return `<div class="post"><div class="post-author"><div class="avatar">${post.initial||people[idx%people.length][0]}</div><div style="flex:1"><strong>${post.name||people[idx%people.length][1]}</strong><small>${post.time||['12 min ago','34 min ago','1 hr ago'][idx%3]} · ${post.kind||'Instagram Reel'}</small></div><span class="pill ${att?'green':'purple'}">${att?'✓ Showed up':'Crew post'}</span></div><div class="post-body">${post.caption||['Testing a new morning routine reel ☀️ Which opening shot makes you want to keep watching?','Little reminder that consistency beats perfection. Sharing today’s outfit details ✨','A tiny café moment from this weekend. Would you watch this as a 15-sec reel?'][idx%3]}</div><div class="post-preview"><span>CREATOR STORY · ${idx+1}</span><strong>${post.headline||['A softer start to the day','Outfit repeat, but make it a look','Your sign to take the coffee break'][idx%3]}</strong></div><div class="post-actions"><button class="action ${att?'done':''}" onclick="attend(${id})">${att?'✓ You showed up':'♡ I showed up'}</button><button class="action" onclick="openVote('${id}')">✧ Give feedback${state.feedback.filter(f=>String(f.postId)===String(id)).length?' · '+state.feedback.filter(f=>String(f.postId)===String(id)).length:''}</button><button class="action" onclick="toast('Post link copied in this demo')">↗ Share</button></div></div>`}
function crewContent(){return `<div class="card"><div class="card-head"><h2>Today in your crew</h2><span class="pill green">● 8 active now</span></div><div class="crew-strip">${people.map(p=>`<div class="avatar" title="${p[1]}">${p[0]}</div>`).join('')}<span class="crew-count">+10 creators</span></div><p class="sub" style="font-size:12px;margin-bottom:18px">Your people are showing up. Return the energy and help every creator get a thoughtful first response.</p>${[0,1,2].map((x)=>postCard(state.posts[x]||{},x)).join('')}<button class="secondary wide" onclick="navigate('crew')">View all crew activity →</button></div>`}
function dealsMini(){return `<div class="card"><div class="card-head"><h2>Picked for you</h2><button class="text-btn" onclick="navigate('deals')">View all →</button></div>${state.deals.filter(d=>d.status==='Open').slice(0,2).map(dealCard).join('')}</div>`}
function reliability(){return `<div class="card"><div class="card-head"><h2>Your creator reliability</h2><span class="pill green">On track</span></div><div style="display:flex;align-items:center;gap:15px;min-width:0"><div aria-label="Reliability score 92 out of 100" style="width:100px;height:100px;min-width:100px;flex:0 0 100px;aspect-ratio:1/1;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) 0 92%,var(--panel2) 92% 100%);position:relative"><div style="position:absolute;inset:7px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:23px;font-weight:850">92</div></div><div style="min-width:0;flex:1"><strong>You're building trust.</strong><p class="sub" style="font-size:11px;margin-top:5px">Based on 5 completed brand assignments. Crew attendance is tracked separately.</p></div></div><div class="divider"></div><div class="progress-row"><div class="progress-label"><span>On-time delivery</span><span>5 of 5</span></div><div class="track"><span style="width:100%"></span></div></div><div class="progress-row"><div class="progress-label"><span>Crew participation</span><span>${12+state.attended.length} check-ins</span></div><div class="track"><span style="width:${Math.min(100,(12+state.attended.length)/15*100)}%"></span></div></div><p class="muted" style="font-size:10px;margin-bottom:0">Demo profile data. Real reliability should be calculated from verified assignment records.</p></div>`}
const sparkPrompts=[
{title:'The 3-second story',desc:'Film the first 3 seconds of a tiny everyday moment. Add one line that makes someone curious.',tag:'STORYTELLING'},
{title:'Make it unmistakably you',desc:'Share one small ritual, opinion or detail your audience would recognise as uniquely yours.',tag:'CREATOR IDENTITY'},
{title:'Turn a comment into content',desc:'Pick a real question your audience asks and turn it into a quick Reel or carousel answer.',tag:'COMMUNITY-LED'},
{title:'One scene, two hooks',desc:'Write two different opening lines for the same clip. Ask your crew which feels clearer—not just louder.',tag:'HOOK LAB'},
{title:'Show the imperfect take',desc:'Share a behind-the-scenes moment that makes your process human and relatable.',tag:'BEHIND THE SCENES'}];
function sparkCard(){let p=sparkPrompts[state.sparkIndex%sparkPrompts.length];return `<section class="spark-card"><div class="spark-top"><span class="spark-label">✦ Orbit Spark · Daily creator quest</span><span class="spark-streak">${state.sparkDone?'✓ Quest complete':'＋ Tiny action, real momentum'}</span></div><h2>${p.title}</h2><p>${p.desc}</p><div class="spark-actions"><button class="primary" onclick="startSpark()">${state.sparkDone?'Create another spark':'Try this prompt'} ↗</button><button class="secondary ${state.sparkDone?'spark-complete':''}" onclick="completeSpark()">${state.sparkDone?'✓ Completed today':'Mark as done'}</button><button class="action" onclick="shuffleSpark()">↻ New idea</button></div></section>`}
function shuffleSpark(){state.sparkIndex=(state.sparkIndex+1+Math.floor(Math.random()*(sparkPrompts.length-1)))%sparkPrompts.length;save();render('dashboard');toast('A fresh Orbit Spark is ready ✨')}
function completeSpark(){state.sparkDone=true;save();render('dashboard');toast('Spark completed! Small steps build creative momentum ✨')}
function startSpark(){let p=sparkPrompts[state.sparkIndex%sparkPrompts.length];openModal('Your Orbit Spark ✦',`<span class="pill purple">${p.tag}</span><h3>${p.title}</h3><p class="sub" style="font-size:13px">${p.desc}</p><div class="field"><label>Your idea or first line</label><textarea id="sparkIdea" placeholder="My opening line could be…"></textarea></div><button class="primary wide" onclick="saveSparkIdea()">Save idea to my creator journal ↗</button>`)}
function saveSparkIdea(){let idea=document.getElementById('sparkIdea').value.trim();if(!idea){toast('Add a line or idea first.');return}state.sparkIdeas=state.sparkIdeas||[];state.sparkIdeas.unshift({idea,at:new Date().toISOString(),prompt:sparkPrompts[state.sparkIndex%sparkPrompts.length].title});save();closeModal();toast('Saved to your Orbit creator journal ✨')}
function render(page='dashboard'){let el=document.getElementById('page');let html='';const btn=`<button class="primary" onclick="openPost()">＋ Share a post</button>`;document.getElementById('crumb').textContent=({dashboard:'Overview',crew:'My crew',hook:'Hook check',deals:'Discover deals',applications:'My applications',profile:'My profile',brand:'Brand workspace'})[page]||'Overview';
if(page==='dashboard'){html=shell('Good morning, '+escapeHTML(state.profile?.name||'Creator')+' ✨','Your crew is your corner of the internet. Let’s show up for each other.',btn)+stats()+sparkCard()+`<div class="dashboard-grid"><div>${crewContent()}</div><div class="right-column">${reliability()}${dealsMini()}<div class="card"><div class="card-head"><h2>Weekly rhythm</h2><span class="pill purple">This week</span></div><p class="sub" style="font-size:12px">Three small actions make a big difference.</p>${[['Show up for 3 crew posts',2,3],['Give feedback on a hook',1,2],['Apply to a relevant deal',state.applied.length?1:0,1]].map(x=>`<div class="progress-row"><div class="progress-label"><span>${x[0]}</span><span>${x[1]}/${x[2]}</span></div><div class="track"><span style="width:${x[1]/x[2]*100}%"></span></div></div>`).join('')}</div></div></div>`}
else if(page==='crew'){html=shell('Your crew, your people','A small circle of creators who get your niche and cheer your work on.',btn)+`<div class="card"><div class="card-head"><div><h2>Soft Life Creators</h2><p class="sub" style="font-size:12px;margin-top:4px">Lifestyle · 5K–25K followers · 15 members</p></div><span class="pill green">● Active crew</span></div><div class="creator-grid">${people.map((p,i)=>`<div class="creator-card"><div class="avatar">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="creator-stats"><div><strong>${[92,88,96,81,90][i]}%</strong><small>Reliability</small></div><div><strong>${[14,9,18,7,11][i]}</strong><small>Check-ins</small></div></div><button class="secondary wide" onclick="toast('Profile preview for ${p[1]}')">View creator</button></div>`).join('')}</div></div><div class="card"><div class="card-head"><h2>Latest crew posts</h2><span class="pill">${3+state.posts.length} posts</span></div>${[0,1,2,...state.posts.map((_,i)=>i+3)].map((x)=>postCard(state.posts[x]||{},x)).join('')}</div>`}
else if(page==='hook'){html=shell('Find your strongest hook','A quick second opinion can help you sharpen the first impression.')+`<div class="dashboard-grid"><div class="card"><div class="card-head"><h2>Start a hook check</h2><span class="pill purple">Crew vote</span></div><p class="sub" style="font-size:12px">Add two thumbnail concepts and ask your crew which one makes them curious. This is feedback, not a guarantee of reach.</p><div class="field"><label>What is your post about?</label><input id="hookTitle" placeholder="e.g. 3-minute everyday makeup"/></div><div class="field"><label>Option A — thumbnail headline</label><input id="hookA" placeholder="The 5-minute glow-up"/></div><div class="field"><label>Option B — thumbnail headline</label><input id="hookB" placeholder="Get ready with me: real life edition"/></div><button class="primary" onclick="createHook()">Send to my crew ↗</button><div class="divider"></div><h2 style="font-size:14px">Crew voting etiquette</h2><p class="sub" style="font-size:12px">Vote based on clarity, curiosity and relevance. Give honest feedback that helps the creator improve.</p></div><div class="card"><div class="card-head"><h2>Live hook check</h2><span class="pill green">Open</span></div><div class="post-preview" style="min-height:150px"><span>HOOK CHECK · MOKTIKA</span><strong id="liveHookTitle">${escapeHTML(state.currentHook?.t||'Which thumbnail earns the pause?')}</strong></div><div class="deal" style="background:var(--panel2)"><small>OPTION A</small><h3 id="liveHookA">${escapeHTML(state.currentHook?.a||'The 5-minute glow-up ✨')}</h3><button class="action ${state.votes.hook==='A'?'done':''}" onclick="voteHook('A')" ${state.votes.hook?'disabled':''}>${state.votes.hook==='A'?'✓ Your vote':'Vote for A'} <span id="voteA">· ${8+(state.currentHook?.votesA||0)} votes</span></button></div><div class="deal" style="background:var(--panel2)"><small>OPTION B</small><h3 id="liveHookB">${escapeHTML(state.currentHook?.b||'Real-life GRWM ☀️')}</h3><button class="action ${state.votes.hook==='B'?'done':''}" onclick="voteHook('B')" ${state.votes.hook?'disabled':''}>${state.votes.hook==='B'?'✓ Your vote':'Vote for B'} <span id="voteB">· ${12+(state.currentHook?.votesB||0)} votes</span></button></div><p class="muted" style="font-size:10px">Demo votes are illustrative. One vote per viewer is recorded in this browser.</p></div></div>`}
else if(page==='deals'){html=shell('Find your next collab','Good work deserves good partners. Explore briefs that fit your voice.')+`<div class="filters"><input id="dealSearch" placeholder="Search brands or campaigns…" oninput="filterDeals()"><select id="dealType" onchange="filterDeals()"><option value="All">All deal types</option><option>Paid</option><option>UGC</option><option>Barter</option></select><select id="dealNiche" onchange="filterDeals()"><option value="All">All niches</option><option>Lifestyle</option><option>Beauty</option><option>Food</option><option>Fashion</option></select></div><div class="deals-grid" id="dealsGrid">${state.deals.map(dealCard).join('')}</div><p class="muted" style="font-size:10px;margin-top:15px">Campaigns are sample listings for this college project. No payment is processed by Orbit.</p>`}
else if(page==='applications'){html=shell('Your applications','Every opportunity starts with a thoughtful pitch.')+`<div class="card"><div class="card-head"><h2>Application tracker</h2><span class="pill purple">${state.applied.length} submitted</span></div>${state.applied.length?state.applied.map(id=>{let d=state.deals.find(x=>x.id===id);return d?`<div class="crew-row"><div class="logo-box">${d.icon}</div><div class="meta"><strong>${d.title}</strong><small>${d.brand} · ${d.type} · ${d.budget}</small></div><span class="pill orange">Submitted</span></div>`:''}).join(''):`<div class="empty"><div style="font-size:30px;margin-bottom:10px">✉</div><strong>No applications yet</strong><p>Find a brief that fits your voice and send your first application.</p><button class="primary" onclick="navigate('deals')">Explore deals →</button></div>`}</div>`}
else if(page==='profile'){let pr=state.profile||{};html=shell('Your creator profile','Help brands understand your style, niche and community.')+`<div class="card" style="max-width:720px"><div style="display:flex;align-items:center;gap:15px;margin-bottom:20px"><div class="avatar" style="width:68px;height:68px;font-size:21px">${escapeHTML((pr.name||'Creator').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><h2 style="margin:0 0 4px">${escapeHTML(pr.name||'Your name')}</h2><p class="sub">@${escapeHTML(pr.handle||'yourhandle')} · ${escapeHTML(pr.niche||'Lifestyle')} creator</p><span class="pill green">Profile details saved locally</span></div></div><div class="field"><label>Display name</label><input id="profileName" value="${escapeAttr(pr.name||'Your name')}"></div><div class="field"><label>Creator niche</label><select id="profileNiche">${['Lifestyle','Beauty','Fashion','Food','Fitness'].map(n=>`<option ${n===(pr.niche||'Lifestyle')?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Follower count</label><input id="profileFollowers" value="${escapeAttr(pr.followers||'')}" type="text"></div><div class="field"><label>Email</label><input id="profileEmail" type="email" value="${escapeAttr(pr.email||'')}"></div><div class="field"><label>Instagram handle</label><input id="profileHandle" value="${escapeAttr(pr.handle||'')}"></div><div class="field"><label>Bio</label><textarea id="profileBio">${escapeHTML(pr.bio||'')}</textarea></div><div class="field"><label>Instagram profile URL</label><input id="profileUrl" value="${escapeAttr(pr.url||'')}"></div><button class="primary" onclick="saveCreatorProfile()">Save profile</button><button class="secondary" style="margin-left:8px" onclick="navigate('deals')">Find matching deals →</button></div>`}
else if(page==='brand'){html=shell('Brand workspace','Meet creators who show up, deliver and fit your campaign.')+`<div class="stats"><div class="stat"><div class="stat-top">Active briefs <span class="stat-icon">◈</span></div><div class="stat-num">4</div><div class="stat-foot">Across 3 niches</div></div><div class="stat"><div class="stat-top">Applications <span class="stat-icon">▤</span></div><div class="stat-num">28</div><div class="stat-foot">Awaiting review</div></div><div class="stat"><div class="stat-top">Creators shortlisted <span class="stat-icon">◎</span></div><div class="stat-num">9</div><div class="stat-foot">Across active briefs</div></div><div class="stat"><div class="stat-top">On-time delivery <span class="stat-icon">✓</span></div><div class="stat-num">94%</div><div class="stat-foot">Verified demo history</div></div></div><div class="card"><div class="card-head"><h2>Your campaign briefs</h2><button class="primary" onclick="openDeal()">＋ Create a brief</button></div>${state.deals.slice(0,4).map(d=>`<div class="crew-row"><div class="logo-box">${d.icon}</div><div class="meta"><strong>${d.title}</strong><small>${d.brand} · ${d.niche} · ${d.type}</small></div><span class="pill ${d.status==='Open'?'green':'orange'}">${d.status}</span><button class="action" onclick="toast('Brief preview opened')">Review</button></div>`).join('')}</div><div class="card"><div class="card-head"><h2>Creator discovery</h2><span class="pill">Sample profiles</span></div><div class="filters"><input id="creatorSearch" placeholder="Search creators or niches…" oninput="filterCreators()"></div><div class="creator-grid" id="creatorGrid">${people.map((p,i)=>`<div class="creator-card" data-search="${p[1].toLowerCase()} ${p[2].toLowerCase()}"><div class="avatar">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="creator-stats"><div><strong>${[92,88,96,81,90][i]}%</strong><small>On-time rate</small></div><div><strong>${[14,9,18,7,11][i]}</strong><small>Check-ins</small></div></div><button class="secondary wide" onclick="toast('Creator shortlisted in this demo')">Shortlist creator</button></div>`).join('')}</div></div>`}
el.innerHTML=html;}
function dealCard(d){let applied=state.applied.includes(d.id);return `<div class="deal"><div class="deal-top"><div class="logo-box">${d.icon}</div><div style="min-width:0;flex:1"><h3>${d.title}</h3><small>${d.brand} · ${d.niche}</small></div><div class="budget">${d.budget}</div></div><div class="deal-tags"><span class="pill ${d.type==='Paid'?'green':d.type==='UGC'?'purple':'orange'}">${d.type}</span><span class="pill">${d.followers}</span></div><p class="sub" style="font-size:12px;margin:0 0 14px">${d.desc}</p><div class="deal-foot"><span>◷ ${d.deadline}</span><button class="apply ${applied?'applied':''}" onclick="applyDeal(${d.id})" ${d.status!=='Open'?'disabled':''}>${applied?'✓ Applied':d.status==='Open'?'Apply now ↗':'Closed'}</button></div></div>`}
function attend(id){if(state.attended.includes(id)){toast('You have already checked in for this post.');return}state.attended.push(id);save();let active=document.querySelector('.nav button.active')?.dataset.page||'dashboard';render(active);toast('You showed up! Your crew appreciates you ✨')}
function applyDeal(id){if(state.applied.includes(id)){toast('You’ve already applied to this brief.');return}state.applied.push(id);save();let active=document.querySelector('.nav button.active')?.dataset.page||'deals';render(active);toast('Application submitted in this demo ✉')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('open')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function openPost(){openModal('Share with your crew',`<div class="field"><label>Post caption</label><textarea id="newCaption" placeholder="What are you sharing today? Ask your crew for feedback…"></textarea></div><div class="field"><label>Content link (optional)</label><input id="newLink" placeholder="https://instagram.com/reel/…"></div><div class="field"><label>Post title / hook</label><input id="newHeadline" placeholder="A tiny ritual that changed my mornings"></div><button class="primary wide" onclick="submitPost()">Share post with crew ↗</button>`)}
function submitPost(){let caption=document.getElementById('newCaption').value.trim(),headline=document.getElementById('newHeadline').value.trim();if(!caption){toast('Add a caption before sharing.');return}state.posts.unshift({id:'p'+Date.now(),initial:(state.profile?.name||'Creator').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),name:state.profile?.name||'Creator',time:'Just now',kind:'New crew post',caption,headline:headline||'New post — feedback welcome'});save();closeModal();navigate('dashboard');toast('Your post is live in the crew feed!')}
function openVote(id){let existing=state.feedback.filter(f=>String(f.postId)===String(id));openModal('Give thoughtful feedback',`<p class="sub" style="font-size:12px">Specific, kind feedback helps creators improve. Comments here are feedback—not proof of algorithmic reach.</p><div class="field"><label>What works well?</label><textarea id="feedbackGood" placeholder="The opening feels relatable because…"></textarea></div><div class="field"><label>One constructive suggestion</label><textarea id="feedbackImprove" placeholder="You could try…"></textarea></div><button class="primary wide" onclick="submitFeedback('${String(id).replace(/'/g, "\'")}')">Send feedback ↗</button>${existing.length?`<p class="muted" style="font-size:11px;margin-top:12px">${existing.length} feedback note(s) saved for this post on this device.</p>`:''}`)}
function submitFeedback(id){let good=document.getElementById('feedbackGood').value.trim(),improve=document.getElementById('feedbackImprove').value.trim();if(!good&&!improve){toast('Add a helpful note before sending.');return}state.feedback.push({id:'f'+Date.now(),postId:id,from:state.profile?.name||'Creator',good,improve,at:new Date().toISOString()});save();closeModal();let active=document.querySelector('.nav button.active')?.dataset.page||'dashboard';render(active);toast('Feedback saved to this browser ✨')}
function createHook(){let t=document.getElementById('hookTitle').value.trim(),a=document.getElementById('hookA').value.trim(),b=document.getElementById('hookB').value.trim();if(!t||!a||!b){toast('Fill in the title and both hook options.');return}state.currentHook={t,a,b,votesA:0,votesB:0,createdAt:new Date().toISOString()};state.votes.hook=null;save();render('hook');toast('Hook check shared with your crew! ✨')}
function voteHook(v){if(state.votes.hook){toast('You have already voted in this hook check.');return}state.votes.hook=v;if(state.currentHook){state.currentHook[v==='A'?'votesA':'votesB']=(state.currentHook[v==='A'?'votesA':'votesB']||0)+1}save();render('hook');toast('Vote recorded. Thanks for helping a creator out!')}
function filterDeals(){let q=(document.getElementById('dealSearch')?.value||'').toLowerCase(),type=document.getElementById('dealType')?.value||'All',niche=document.getElementById('dealNiche')?.value||'All';let list=state.deals.filter(d=>(d.title+' '+d.brand+' '+d.desc).toLowerCase().includes(q)&&(type==='All'||d.type===type)&&(niche==='All'||d.niche===niche));document.getElementById('dealsGrid').innerHTML=list.length?list.map(dealCard).join(''):`<div class="empty">No matching briefs yet. Try a different filter.</div>`}
function filterCreators(){let q=document.getElementById('creatorSearch').value.toLowerCase();document.querySelectorAll('#creatorGrid .creator-card').forEach(c=>c.style.display=c.dataset.search.includes(q)?'':'none')}
function openDeal(){openModal('Create a campaign brief',`<div class="field"><label>Campaign title</label><input id="brandTitle" placeholder="e.g. Festive edit campaign"></div><div class="field"><label>Brand name</label><input id="brandName" placeholder="Your brand"></div><div class="field"><label>Compensation type</label><select id="brandType"><option>Paid</option><option>Barter</option><option>UGC</option></select></div><div class="field"><label>Budget or product value</label><input id="brandBudget" placeholder="e.g. ₹7,500"></div><div class="field"><label>Creator niche</label><select id="brandNiche"><option>Lifestyle</option><option>Beauty</option><option>Fashion</option><option>Food</option></select></div><div class="field"><label>Brief</label><textarea id="brandDesc" placeholder="What should creators deliver?"></textarea></div><button class="primary wide" onclick="submitDeal()">Publish demo brief ↗</button>`)}
function submitDeal(){let title=document.getElementById('brandTitle').value.trim(),brand=document.getElementById('brandName').value.trim(),budget=document.getElementById('brandBudget').value.trim(),desc=document.getElementById('brandDesc').value.trim();if(!title||!brand||!budget||!desc){toast('Please complete all brief fields.');return}state.deals.unshift({id:Date.now(),brand,icon:'✦',title,type:document.getElementById('brandType').value,budget,niche:document.getElementById('brandNiche').value,followers:'5K–25K',deadline:'Apply by Nov 7',desc,status:'Open'});save();closeModal();navigate('brand');toast('Brief published in this demo!')}
function showLanding(){document.querySelector('.app').classList.remove('hide-app');document.querySelector('.app').classList.add('landing-mode');let host=document.getElementById('page');host.classList.remove('page');host.innerHTML=`<div class="landing-wrap"><div class="landing-nav"><div class="landing-logo"><span class="orbit-mark">◉</span> orbit<span style="color:var(--purple2)">.</span></div><span class="pill purple">CREATOR COLLECTIVE</span></div><section class="landing-hero"><div><div class="kicker">Better together, by design</div><h1>Your people.<br><span style="color:var(--purple2)">Your next orbit.</span></h1><p>Orbit brings creators together in small, supportive crews of around 15 people with similar niches and follower ranges. Show up for each other’s content, exchange thoughtful feedback, grow your creative practice, and discover brand collaboration opportunities.</p><button class="primary" onclick="showSetup()">Set Up Your Creator Profile ↗</button><p class="muted-note" style="margin-top:12px">A creator-first community demo. No Instagram connection is assumed.</p></div><div class="hero-panel"><div class="pill purple">YOUR CREATOR CREW</div><h2 style="font-size:22px;margin:16px 0 4px">Small circles. Real momentum.</h2><p style="font-size:12px;margin:0 0 12px;color:#c7c1e2">A preview of the activity waiting inside Orbit.</p><div class="mini-row"><div class="avatar">MR</div><div style="flex:1"><strong>Meher Rao</strong><div style="font-size:11px;color:#c7c1e2">Beauty · shared a new reel</div></div><span class="pill green">Feedback</span></div><div class="mini-row"><div class="avatar">SI</div><div style="flex:1"><strong>Sana Iyer</strong><div style="font-size:11px;color:#c7c1e2">Lifestyle · needs a hook vote</div></div><span class="pill purple">Hook check</span></div><div class="mini-row"><div class="avatar">TK</div><div style="flex:1"><strong>Tara Khanna</strong><div style="font-size:11px;color:#c7c1e2">Fashion · found a campaign</div></div><span class="pill orange">Brand deal</span></div><div style="font-size:11px;color:#c7c1e2;margin-top:15px">Sample community activity · not your personal activity</div></div></section><section class="landing-section"><div class="kicker">How Orbit helps</div><h2>Growth feels better when it’s shared.</h2><p class="sub">A consistent circle for the work you’re already creating.</p><div class="feature-grid"><div class="feature"><div class="stat-icon">◎</div><h3>Find your crew</h3><p>Join a close-knit group of roughly 15 creators aligned by niche and audience size, so your feedback feels relevant.</p></div><div class="feature"><div class="stat-icon">✧</div><h3>Engage with intention</h3><p>Support crew posts, test hooks, share constructive feedback, and build a more consistent creative routine.</p></div><div class="feature"><div class="stat-icon">◈</div><h3>Discover collaborations</h3><p>Explore sample brand briefs and opportunities filtered around your niche and follower range.</p></div></div></section><section class="landing-section" style="text-align:center;border-top:1px solid var(--line);padding-top:30px"><h2>Ready to find your people?</h2><p class="sub" style="margin-bottom:20px">Set up your creator profile to personalize your Orbit dashboard.</p><button class="primary" onclick="showSetup()">Set Up Your Creator Profile ↗</button></section></div>`;}
function showSetup(){document.querySelector('.app').classList.remove('hide-app');document.querySelector('.app').classList.add('landing-mode');let host=document.getElementById('page');host.classList.remove('page');let pr=state.profile||{};host.innerHTML=`<div class="landing-wrap"><div class="landing-nav"><div class="landing-logo"><span class="orbit-mark">◉</span> orbit<span style="color:var(--purple2)">.</span></div><button class="secondary" onclick="showLanding()">← Back to intro</button></div><div class="setup-card"><div class="kicker">Your Orbit starts here</div><h1 style="margin:8px 0">Set up your creator profile</h1><p class="sub" style="margin-bottom:23px">Tell us a little about your content so your experience can feel like yours.</p><form onsubmit="submitCreatorSetup(event)"><div class="setup-grid"><div class="field"><label for="setupName">Your name *</label><input id="setupName" autocomplete="name" required value="${escapeAttr(pr.name||'') }" placeholder="e.g. Aanya Sharma"></div><div class="field"><label for="setupEmail">Email address *</label><input id="setupEmail" type="email" autocomplete="email" required value="${escapeAttr(pr.email||'')}" placeholder="you@example.com"></div><div class="field"><label for="setupHandle">Instagram handle *</label><input id="setupHandle" required value="${escapeAttr(pr.handle||'')}" placeholder="@yourhandle"></div><div class="field"><label for="setupNiche">Main creator niche *</label><select id="setupNiche">${['Lifestyle','Beauty','Fashion','Food','Fitness','Travel','Parenting','Tech','Other'].map(n=>`<option ${n===(pr.niche||'Lifestyle')?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="setupFollowers">Follower count *</label><input id="setupFollowers" required inputmode="numeric" value="${escapeAttr(pr.followers||'')}" placeholder="e.g. 12400"></div><div class="field"><label for="setupPicture">Profile picture (optional)</label><input id="setupPicture" type="file" accept="image/*"><p class="muted-note">Stored in this browser for this demo.</p></div></div><div class="field" style="margin-top:13px"><label for="setupBio">Short creator bio (optional)</label><textarea id="setupBio" placeholder="What do you love creating?">${escapeHTML(pr.bio||'')}</textarea></div><p class="muted-note">Your profile is saved in this browser on this device. This prototype does not yet provide cross-device accounts or server-side authentication.</p><button class="primary wide" style="margin-top:10px" type="submit">Save profile & open my dashboard ↗</button><button class="secondary wide" style="margin-top:10px" type="button" onclick="connectInstagram()">Connect Instagram (optional)</button><p class="muted-note" style="margin-top:10px">Instagram connection is not active in this prototype. You can enter your handle manually above.</p></form></div></div>`;}
function submitCreatorSetup(event){event.preventDefault();let name=document.getElementById('setupName').value.trim(),email=document.getElementById('setupEmail').value.trim(),handle=document.getElementById('setupHandle').value.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/\/$/,''),niche=document.getElementById('setupNiche').value,followers=document.getElementById('setupFollowers').value.trim(),bio=document.getElementById('setupBio').value.trim(),file=document.getElementById('setupPicture').files[0];if(!name||!email||!handle||!followers){toast('Please complete all required fields.');return}const finish=(picture='')=>{state.profile={...(state.profile||{}),name,email,handle,niche,followers,bio,picture,url:'https://www.instagram.com/'+handle+'/',setupComplete:true};save();document.querySelector('.app').classList.remove('hide-app','landing-mode');document.getElementById('page').classList.add('page');syncIdentity();render('dashboard');window.scrollTo({top:0,behavior:'smooth'});toast('Welcome to your Orbit, '+name+' ✨')};if(file){if(file.size>700000){toast('Please choose a picture smaller than 700 KB.');return}let reader=new FileReader();reader.onload=()=>finish(String(reader.result));reader.readAsDataURL(file)}else finish(state.profile?.picture||'')}
function connectInstagram(){toast('Instagram OAuth is not configured yet. Enter your handle manually for now.');}
function syncIdentity(){let pr=state.profile||{},name=pr.name||'Creator',meta=(pr.niche||'Creator')+' · '+(pr.handle?'@'+pr.handle:'profile');['sidebarName'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=name});let m=document.getElementById('sidebarMeta');if(m)m.textContent=meta;let initials=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'◎';['sidebarAvatar','topAvatar'].forEach(id=>{let e=document.getElementById(id);if(e){if(pr.picture){e.style.backgroundImage=`url("${pr.picture}")`;e.style.backgroundSize='cover';e.textContent=''}else e.textContent=initials}})}
function boot(){if(state.currentHook){let h=state.currentHook;setTimeout(()=>{let a=document.getElementById('liveHookTitle');if(a){a.textContent=h.t;document.getElementById('liveHookA').textContent=h.a;document.getElementById('liveHookB').textContent=h.b}},50)}if(state.profile?.setupComplete){document.querySelector('.app').classList.remove('hide-app','landing-mode');syncIdentity();render('dashboard')}else showLanding()}
boot();
</script>
</body></html>
